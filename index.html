<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>IT Seminar Student Registration</h1>
  <form id="registrationForm" novalidate>
    <div>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required aria-describedby="fullNameError">
      <span id="fullNameError" class="error"></span>
    </div>

    <div>
      <label for="studentNumber">Student Number</label>
      <input type="text" id="studentNumber" name="studentNumber" required aria-describedby="studentNumberError">
      <span id="studentNumberError" class="error"></span>
    </div>

    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required aria-describedby="emailError">
      <span id="emailError" class="error"></span>
    </div>

    <div>
      <label for="mobileNumber">Mobile Number</label>
      <input type="tel" id="mobileNumber" name="mobileNumber" required aria-describedby="mobileNumberError">
      <span id="mobileNumberError" class="error"></span>
    </div>

    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required aria-describedby="passwordError passwordFeedback">
      <span id="passwordError" class="error"></span>
      <span id="passwordFeedback" class="feedback"></span>
    </div>

    <div>
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required aria-describedby="confirmPasswordError">
      <span id="confirmPasswordError" class="error"></span>
    </div>

    <div>
      <label for="course">Course</label>
      <select id="course" name="course" required aria-describedby="courseError">
        <option value="">Select your course.</option>
        <option value="BSIT">BSIT</option>
        <option value="BSCS">BSCS</option>
      </select>
      <span id="courseError" class="error"></span>
    </div>

    <div>
      <input type="checkbox" id="terms" name="terms" required aria-describedby="termsError">
      <label for="terms">I agree to the terms and conditions</label>
      <span id="termsError" class="error"></span>
    </div>

    <div>
      <button type="submit" id="registerBtn">Register</button>
      <button type="reset" id="resetBtn">Reset</button>
    </div>
  </form>

  <div id="successMessage"></div>
  <div id="registrationSummary">
    <p>Full Name: <span id="summaryName"></span></p>
    <p>Student Number: <span id="summaryStudentNumber"></span></p>
    <p>Email: <span id="summaryEmail"></span></p>
    <p>Mobile Number: <span id="summaryMobileNumber"></span></p>
    <p>Course: <span id="summaryCourse"></span></p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
